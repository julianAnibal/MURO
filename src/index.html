<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>MURO Configuration</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <header class="toolbar">
        <h1 class="title"><img src="muro-logo.svg" alt="MURO Logo" class="logo"> MURO</h1>
        <div class="toolbar-actions">
          <button id="start-playback" class="button">Start Playback</button>
          <button id="load-profile" class="button button-secondary">Load Profile</button>
          <button id="save-profile" class="button button-secondary">Save Profile</button>
          <button id="detect-displays" class="button button-secondary">Refresh Displays</button>
        </div>
        <div class="by-logos">
          <span class="by-text">by</span>
          <img src="dna-logo.png" alt="DNA Logo" class="by-logo dna-logo">
          <img src="habitat-logo.svg" alt="Habitat Logo" class="by-logo habitat-logo">
        </div>
      </header>
      <div class="main-content">
        <aside class="sidebar">
          <h2>Detected Displays</h2>
          <ul id="display-list" class="display-list">
            <!-- Display items will be populated here -->
          </ul>
        </aside>
        <main id="canvas-container" class="canvas-container">
            <!-- Screen representations will be added here -->
        </main>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
