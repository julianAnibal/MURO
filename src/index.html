<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>MultiVideo Configuration</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <header class="toolbar">
        <h1 class="title">MultiVideo</h1>
        <div class="toolbar-actions">
          <button id="start-playback" class="button">Start Playback</button>
          <button id="detect-displays" class="button button-secondary">Refresh Displays</button>
        </div>
      </header>
      <main class="main-content">
        <h2>Detected Displays</h2>
        <ul id="display-list" class="display-list">
          <!-- Display items will be populated here -->
        </ul>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
